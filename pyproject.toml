[project]
name = "fraud-p2p"
version = "1.0.0"
description = "Detección de fraude en transferencias P2P (PaySim): modelo, umbral económico, API y plataforma operativa."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "María Belén Silvano Ruata" }]
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "joblib>=1.4",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]
app = [
  "streamlit>=1.40",
  "plotly>=5.24",
  "requests>=2.32",
]
replayer = [
  "requests>=2.32",
]
analysis = [
  "jupyter>=1.1",
  "plotly>=5.24",
  "kaleido>=1.0",
  "scipy>=1.14",
  "nbclient>=0.10",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_p2p"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: requiere la capa oro completa (data/gold)"]
